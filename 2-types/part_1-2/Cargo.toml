[package]
name = "part_1-2"
version = "0.2.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
humantime-serde = "1"
uuid = { version = "1", features = ["serde", "v4"] }
url = { version = "2", features = ["serde"] }
time = { version = "0.3", features = ["serde", "parsing", "formatting", "macros"] }

[dev-dependencies]
tempfile = "3"
