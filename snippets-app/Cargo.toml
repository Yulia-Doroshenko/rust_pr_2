[package]
name = "snippets-app"
version = "0.2.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
humantime-serde = "1"
uuid = { version = "1", features = ["serde", "v4"] }
url = { version = "2", features = ["serde"] }
time = { version = "0.3", features = ["serde", "parsing", "formatting", "macros"] }
